---
# Installs the Ubuntu-packaged containerd 2.x and enables the systemd cgroup
# driver, matching the existing cluster (config version 3).

- name: Install containerd
  ansible.builtin.apt:
    name: "{{ containerd_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/containerd exists
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Check for an existing containerd config
  ansible.builtin.stat:
    path: /etc/containerd/config.toml
  register: containerd_config

# Only lay down a fresh default config when there isn't one already. This keeps
# a run against an EXISTING node from overwriting its config (and bouncing all
# its containers). SystemdCgroup is then enforced idempotently below.
- name: Generate default containerd config
  ansible.builtin.command: containerd config default
  register: containerd_default_config
  changed_when: false
  when: not containerd_config.stat.exists

- name: Write default containerd config (fresh nodes only)
  ansible.builtin.copy:
    content: "{{ containerd_default_config.stdout }}"
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: "0644"
  when: not containerd_config.stat.exists
  notify: Restart containerd

- name: Enable SystemdCgroup (idempotent; only changes if currently false)
  ansible.builtin.replace:
    path: /etc/containerd/config.toml
    regexp: 'SystemdCgroup = false'
    replace: 'SystemdCgroup = true'
  notify: Restart containerd

- name: Enable and start containerd
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started

- name: Flush handlers so containerd restarts before kubeadm runs
  ansible.builtin.meta: flush_handlers
