---
# Kyverno (policy engine) via helm. Default values.
- name: Deploy Kyverno
  kubernetes.core.helm:
    name: kyverno
    chart_ref: kyverno/kyverno
    chart_repo_url: https://kyverno.github.io/kyverno/
    chart_version: "{{ kyverno_chart_version }}"
    release_namespace: kyverno
    create_namespace: true
    binary_path: "{{ helm_bin }}"
    kubeconfig: /etc/kubernetes/admin.conf
    wait: true
    wait_timeout: 10m
