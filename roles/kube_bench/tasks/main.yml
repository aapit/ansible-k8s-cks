---
# kube-bench (CIS Kubernetes Benchmark) installed from the upstream .deb. cp only.
- name: Check kube-bench presence
  ansible.builtin.command: kube-bench version
  register: kube_bench_check
  changed_when: false
  failed_when: false
  check_mode: false

# apt downloads the .deb itself when given a URL (no /tmp handling needed).
- name: Install kube-bench from the upstream .deb
  ansible.builtin.apt:
    deb: "https://github.com/aquasecurity/kube-bench/releases/download/{{ kube_bench_version }}/kube-bench_{{ kube_bench_version | regex_replace('^v', '') }}_linux_{{ arch }}.deb"
  when: kube_bench_version | regex_replace('^v', '') not in kube_bench_check.stdout
