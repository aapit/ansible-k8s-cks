---
# NGINX Gateway Fabric (Gateway API implementation) via its OCI helm chart.
# Requires the Gateway API CRDs to be installed first. Matches: service.type=NodePort.

- name: Install Gateway API CRDs
  ansible.builtin.command:
    cmd: "kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/{{ gateway_api_version }}/standard-install.yaml"
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: gwapi_crd
  changed_when: "'created' in gwapi_crd.stdout or 'configured' in gwapi_crd.stdout"

- name: Deploy NGINX Gateway Fabric
  kubernetes.core.helm:
    name: ngf
    chart_ref: "oci://ghcr.io/nginx/charts/nginx-gateway-fabric"
    chart_version: "{{ nginx_gateway_chart_version }}"
    release_namespace: nginx-gateway
    create_namespace: true
    binary_path: "{{ helm_bin }}"
    kubeconfig: /etc/kubernetes/admin.conf
    values:
      service:
        type: NodePort
    wait: true
    wait_timeout: 10m
