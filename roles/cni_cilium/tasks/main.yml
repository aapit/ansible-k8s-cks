---
# Installs Cilium as the CNI via helm (runs on the control plane).
# Matches the running cluster: ipam=kubernetes, hubble relay + ui enabled.

- name: Deploy Cilium
  kubernetes.core.helm:
    name: cilium
    chart_ref: cilium/cilium
    chart_repo_url: https://helm.cilium.io/
    chart_version: "{{ cilium_chart_version }}"
    release_namespace: kube-system
    binary_path: "{{ helm_bin }}"
    kubeconfig: /etc/kubernetes/admin.conf
    values: "{{ cilium_values | combine({'hubble': {'relay': {'enabled': enable_hubble}, 'ui': {'enabled': enable_hubble}}}) }}"
    wait: true
    wait_timeout: 10m

- name: Wait for all nodes to become Ready
  kubernetes.core.k8s_info:
    kind: Node
    kubeconfig: /etc/kubernetes/admin.conf
  register: node_info
  until: >
    node_info.resources | length > 0 and
    (node_info.resources
      | map(attribute='status.conditions')
      | map('selectattr', 'type', 'eq', 'Ready')
      | map('map', attribute='status')
      | map('first') | list | unique) == ['True']
  retries: 30
  delay: 10
