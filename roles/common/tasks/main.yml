---
# Base node prep required by kubeadm on every node.

- name: Set a stable hostname matching the inventory name
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Ensure hostname resolves via /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"

- name: Disable swap now
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb | default(0) > 0
  changed_when: ansible_swaptotal_mb | default(0) > 0

- name: Remove swap entries from /etc/fstab (persist across reboot)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'

- name: Load required kernel modules now
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboot
  ansible.builtin.copy:
    src: k8s-modules.conf
    dest: /etc/modules-load.d/k8s.conf
    owner: root
    group: root
    mode: "0644"

- name: Apply Kubernetes sysctl settings
  ansible.builtin.copy:
    src: k8s-sysctl.conf
    dest: /etc/sysctl.d/99-kubernetes-cri.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload sysctl

- name: Install base packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
      - jq
      - podman
      - python3-debian   # required by ansible.builtin.deb822_repository
    state: present
    update_cache: true
    cache_valid_time: 3600
