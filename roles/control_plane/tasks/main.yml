---
# Bootstraps the control plane with kubeadm and installs helm (used by the
# add-on roles that run here). Idempotent: skips init if already bootstrapped.

- name: Check whether the control plane is already initialized
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: kubeadm_admin_conf

- name: Render kubeadm init config
  ansible.builtin.template:
    src: kubeadm-init.yaml.j2
    dest: /root/kubeadm-init.yaml
    owner: root
    group: root
    mode: "0600"
  when: not kubeadm_admin_conf.stat.exists

- name: Run kubeadm init
  ansible.builtin.command:
    cmd: kubeadm init --config /root/kubeadm-init.yaml --upload-certs
  when: not kubeadm_admin_conf.stat.exists
  register: kubeadm_init
  changed_when: kubeadm_init.rc == 0

- name: Create .kube dir for {{ ansible_user }}
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0755"

- name: Install kubeconfig for {{ ansible_user }}
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    remote_src: true
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0600"

- name: Install kubeconfig for root
  ansible.builtin.file:
    path: /root/.kube
    state: directory
    mode: "0755"

- name: Copy admin.conf to root kubeconfig
  ansible.builtin.copy:
    src: /etc/kubernetes/admin.conf
    dest: /root/.kube/config
    remote_src: true
    owner: root
    group: root
    mode: "0600"

# --- python deps for the helm / k8s ansible modules -------------------------
- name: Install python libraries for the kubernetes.core modules
  ansible.builtin.apt:
    name:
      - python3-yaml
      - python3-kubernetes
    state: present
    update_cache: true
    cache_valid_time: 3600

# --- helm (for the add-on roles) --------------------------------------------
- name: Check helm presence
  ansible.builtin.stat:
    path: "{{ helm_bin }}"
  register: helm_stat

- name: Download helm
  ansible.builtin.unarchive:
    src: "https://get.helm.sh/helm-{{ helm_version }}-linux-{{ arch }}.tar.gz"
    dest: /tmp
    remote_src: true
  when: not helm_stat.stat.exists

- name: Install helm binary
  ansible.builtin.copy:
    src: "/tmp/linux-{{ arch }}/helm"
    dest: "{{ helm_bin }}"
    remote_src: true
    owner: root
    group: root
    mode: "0755"
  when: not helm_stat.stat.exists

# --- join command for the workers -------------------------------------------
# no_log: the join command embeds a bootstrap token + CA cert hash; keep it out
# of Ansible output and logs even on verbose runs.
- name: Generate worker join command
  ansible.builtin.command: kubeadm token create --print-join-command
  register: join_command_raw
  changed_when: false
  no_log: true

- name: Stash join command for the worker role
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_command_raw.stdout }}"
  no_log: true
