---
# Inventory for the CKS practice cluster running on Multipass VMs on the Mac.
#
# ansible_host = the VM's IP on the PRIMARY Multipass network (bridge100,
# 192.168.252.x) — the only one reachable from the Mac host. This IP is also
# used as the k8s node-ip / apiserver advertise address.
# Regenerate after (re)launching VMs with:  make inventory
#
# NB: the existing hand-built cluster advertises on a secondary 192.168.74.x
# network that is NOT reachable from the host; a fresh cluster built by this
# playbook uses the primary 192.168.252.x network for everything.
all:
  children:
    control_plane:
      hosts:
        cp1:
          ansible_host: 192.168.252.6
    workers:
      hosts:
        worker1:
          ansible_host: 192.168.252.7
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: "~/.ssh/id_ed25519"
    ansible_python_interpreter: /usr/bin/python3
